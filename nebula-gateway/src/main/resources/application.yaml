server:
  port: 8080

spring:
  application:
    name: nebula-gateway

routes:
  files:
    uri: ${FILES_SERVICE_URI:http://localhost:5000}
  auth:
    uri: ${AUTH_SERVICE_URI:http://localhost:4000}
  user:
    uri: ${USER_SERVICE_URI:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  hmacSecret: ${AUTH_SECRET}
