name: CI (monorepo)

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      control_plane: ${{ steps.filter.outputs.control_plane }}
      user_service: ${{ steps.filter.outputs.user_service }}
      docs: ${{ steps.filter.outputs.docs }}
      agent: ${{ steps.filter.outputs.agent }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'nebulavault-frontend/**'
            auth:
              - 'benzene-auth-service/**'
            gateway:
              - 'nebula-gateway/**'
            control_plane:
              - 'benzene-control-plane/**'
            user_service:
              - 'nebulavault-user-service/**'
            agent:
              - 'benzene-node-agent/**'
            docs:
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
            infra:
              - 'infrastructure/**'

  web:
    name: Frontend (Next.js) — build
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebulavault-frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GATEWAY_ORIGIN: http://localhost:8080
      GATEWAY_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nebulavault-frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev; else npm i; fi
      - name: Lint (if present)
        run: npm run lint --if-present
      - name: Typecheck (if present)
        run: npm run typecheck --if-present
      - name: Build (with fallback)
        run: |
          if npm run -s | grep -qE '(^| )build( |$)'; then
            npm run build
          else
            npx --yes next build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: |
            nebulavault-frontend/.next
            nebulavault-frontend/next.config.*
            nebulavault-frontend/package*.json

  auth:
    name: Auth (Node/TS) — build & test
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benzene-auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: benzene-auth-service/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build (with fallback)
        run: |
          if npm run -s | grep -qE '(^| )build( |$)'; then
            npm run build
          else
            npx --yes tsc -p tsconfig.json
          fi
      - name: Test (if present)
        run: npm test --if-present

  gateway:
    name: Gateway (Spring Boot) — package
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebula-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -B -ntp test
      - name: Package
        run: ./mvnw -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-jar
          path: nebula-gateway/target/*.jar

  control-plane:
    name: Control plane (Node/TS) — build & test
    needs: detect-changes
    if: needs.detect-changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benzene-control-plane
    # The control-plane tests run against a real PostgreSQL rather than a fake:
    # partial unique indexes, row locking and aggregate filters carry the
    # behaviour under test, and no in-memory substitute reproduces them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benzene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/benzene_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: benzene-control-plane/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
      - name: Check migrations are up to date with the schema
        run: |
          npx drizzle-kit generate --name=ci_drift_check
          if ! git diff --quiet -- drizzle; then
            echo "::error::drizzle schema and migrations have drifted; run 'npm run db:generate' and commit"
            git --no-pager diff --stat -- drizzle
            exit 1
          fi
      - name: Test
        run: npm test

  user-service:
    name: User service (Spring Boot) — package & test
    needs: detect-changes
    if: needs.detect-changes.outputs.user_service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebulavault-user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -B -ntp test
      - name: Package
        run: ./mvnw -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: nebulavault-user-service/target/*.jar

  infra:
    name: Terraform — format & validate
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend, no credentials needed)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  agent:
    name: Node agent (Node/TS) — build & test
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benzene-node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: benzene-node-agent/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # The agent and the control plane are separate deployables that each hold
      # a copy of the request-signing format. These vectors are the contract
      # between them, so a drift here would break device authentication in a
      # way neither package's own tests would catch.
      - name: Protocol vectors match the control plane
        run: |
          diff -u ../benzene-control-plane/src/modules/devices/protocolVectors.ts src/protocolVectors.ts
          diff -u ../benzene-control-plane/src/modules/placement/grantVectors.ts src/grantVectors.ts

  docs:
    name: Agent guides are in sync
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CLAUDE.md and AGENTS.md serve different tools but must say the same
      # thing; a guide that drifts is worse than no guide, because it is
      # trusted.
      - name: CLAUDE.md matches AGENTS.md
        run: diff -u AGENTS.md CLAUDE.md
