name: Release (build & push images)

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WEB_IMG: ghcr.io/${{ github.repository_owner }}/nebulavault-web
  AUTH_IMG: ghcr.io/${{ github.repository_owner }}/nebulavault-auth
  GATEWAY_IMG: ghcr.io/${{ github.repository_owner }}/nebulavault-gateway
  CONTROL_PLANE_IMG: ghcr.io/${{ github.repository_owner }}/benzene-control-plane
  USER_SERVICE_IMG: ghcr.io/${{ github.repository_owner }}/nebulavault-user-service

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      control_plane: ${{ steps.filter.outputs.control_plane }}
      user_service: ${{ steps.filter.outputs.user_service }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'nebulavault-frontend/**'
            auth:
              - 'benzene-auth-service/**'
            gateway:
              - 'nebula-gateway/**'
            control_plane:
              - 'benzene-control-plane/**'
            user_service:
              - 'nebulavault-user-service/**'

  web:
    name: Build & push — Web
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: hasdf
        run: |
          if [ -f nebulavault-frontend/Dockerfile ]; then echo "path=nebulavault-frontend" >> $GITHUB_OUTPUT; fi
      - id: meta
        if: steps.hasdf.outputs.path != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMG }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        if: steps.hasdf.outputs.path != ''
        with:
          context: ${{ steps.hasdf.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  auth:
    name: Build & push — Auth
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.auth == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: hasdf
        run: |
          if [ -f benzene-auth-service/Dockerfile ]; then echo "path=benzene-auth-service" >> $GITHUB_OUTPUT; fi
      - id: meta
        if: steps.hasdf.outputs.path != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AUTH_IMG }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        if: steps.hasdf.outputs.path != ''
        with:
          context: ${{ steps.hasdf.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  gateway:
    name: Build & push — Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: hasdf
        run: |
          if [ -f nebula-gateway/Dockerfile ]; then echo "path=nebula-gateway" >> $GITHUB_OUTPUT; fi
      - id: meta
        if: steps.hasdf.outputs.path != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMG }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        if: steps.hasdf.outputs.path != ''
        with:
          context: ${{ steps.hasdf.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  control-plane:
    name: Build & push — Control plane
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.control_plane == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTROL_PLANE_IMG }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: benzene-control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  user-service:
    name: Build & push — User service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.user_service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.USER_SERVICE_IMG }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: nebulavault-user-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
